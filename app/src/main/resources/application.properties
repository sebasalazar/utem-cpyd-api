spring.application.name=cpyd
server.servlet.context-path=/cpyd

# Valores sobreescribibles por variables de entorno (no dejar secretos reales en el repositorio)
spring.datasource.url=${CPYD_DB_URL:jdbc:postgresql:exchangesdb}
spring.datasource.username=${CPYD_DB_USER:utem}
spring.datasource.password=${CPYD_DB_PASSWORD:utem}

logging.level.cl.utem.inf.cpyd=${CPYD_LOG_LEVEL:INFO}

# Clave de firma JWT (HS256, minimo 32 bytes). Obligatoria: CPYD_SIGN
cpyd.sign=${CPYD_SIGN:}

# Limite de intentos fallidos de login por correo
cpyd.login.max-attempts=5
cpyd.login.window.minutes=15

# --- Documentacion OpenAPI / Swagger UI (springdoc) ---
# Swagger UI: /cpyd/swagger-ui.html   Especificacion JSON: /cpyd/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=2
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
