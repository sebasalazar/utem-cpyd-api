# ===================================================================
# CONFIGURACION DE PRUEBAS (TEST)
# ===================================================================
# Este archivo sobrescribe las propiedades de src/main/resources
# unicamente durante la ejecucion de pruebas.

# --- Base de datos (H2 emulando PostgreSQL) ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

cpyd.sign=01234567890123456789012345678901

# --- Contexto de servlet igual que en produccion (este archivo reemplaza al de main en las pruebas) ---
server.servlet.context-path=/cpyd

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
