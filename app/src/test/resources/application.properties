# ===================================================================
# CONFIGURACI\u00c3\u0093N DE PRUEBAS (TEST)
# ===================================================================
# Este archivo sobrescribe las propiedades de src/main/resources 
# \u00c3\u00banicamente durante la ejecuci\u00c3\u00b3n de pruebas.

# --- Configuraci\u00c3\u00b3n de Base de Datos (Ejemplo con H2 emulando PostgreSQL) ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

cpyd.sign=01234567890123456789012345678901

# --- Configuraci\u00c3\u00b3n JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
